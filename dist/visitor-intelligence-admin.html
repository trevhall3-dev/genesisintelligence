<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private Visitor Intelligence | Genesis Intel Hub</title><style>body{font:16px system-ui;background:#07110e;color:#e6f8eb;margin:0;padding:2rem}main{max-width:1050px;margin:auto}h1{color:#91f6b0}section{background:#10251b;border:1px solid #326c48;border-radius:12px;padding:1rem;margin:1rem 0}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #31523d;padding:.5rem}small{color:#a9c6b2}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem}.metrics section{margin:0}strong{font-size:1.7rem}a{color:#91f6b0}</style></head><body><main><small>PRIVATE • ACCESS-CONTROLLED ANALYTICS</small><h1>Genesis Visitor Intelligence</h1><p>Approximate network/geographic information. ASN affiliation does not establish employer or individual identity. Session totals are not unique people.</p><p id="status" role="status">Verifying access and loading 30-day statistics…</p><div id="metrics" class="metrics"></div><div id="tables"></div><p><a href="/">Return to Genesis Intel Hub</a></p></main><script>
(async()=>{const status=document.getElementById("status");try{
const r=await fetch("/api/admin/visitor-intelligence",{credentials:"same-origin",cache:"no-store"});if(!r.ok)throw Error("Analytics access unavailable ("+r.status+"). Configure Cloudflare Access application and Worker ACCESS_TEAM_DOMAIN / ACCESS_AUD.");
const d=await r.json();status.textContent="Verified • "+d.period;
const m=document.getElementById("metrics");for(const [label,value] of Object.entries({Sessions:d.summary.sessions,Pageviews:d.summary.pageviews,Events:d.summary.events})){const el=document.createElement("section");const h=document.createElement("h2");h.textContent=label;const v=document.createElement("strong");v.textContent=String(value??0);el.append(h,v);m.append(el)}
for(const [name,rows] of Object.entries({Events:d.events,Countries:d.countries,"Network operators (ASN)":d.networks,"Research sections":d.sections})){const section=document.createElement("section"),h=document.createElement("h2");h.textContent=name;section.append(h);const table=document.createElement("table");const cols=Object.keys(rows[0]||{});if(cols.length){const tr=document.createElement("tr");for(const c of cols){const th=document.createElement("th");th.textContent=c;tr.append(th)}table.append(tr);for(const row of rows){const tr=document.createElement("tr");for(const c of cols){const td=document.createElement("td");td.textContent=String(row[c]??"—");tr.append(td)}table.append(tr)}}else{const p=document.createElement("p");p.textContent="No records yet";section.append(p)}section.append(table);document.getElementById("tables").append(section)}
}catch(e){status.textContent=e.message}})();
</script></body></html>
