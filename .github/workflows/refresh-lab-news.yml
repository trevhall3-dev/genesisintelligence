name: Collect national laboratory Genesis news
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_genesis_news.py'
      - '.github/workflows/refresh-lab-news.yml'
  workflow_dispatch:
  schedule:
    - cron: "23 */4 * * *"
permissions:
  contents: write
concurrency:
  group: genesis-news-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile scripts/collect_genesis_news.py
      - name: Verify feed parsing and archive preservation
        run: python scripts/test_lab_feeds.py
      - name: Merge archive safely and publish
        run: |
          git config user.name "genesis-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/collect_genesis_news.py --channel labs
            git add dist/news-archive.json
            if git diff --staged --quiet; then
              echo "No new source records"
              exit 0
            fi
            git commit -m "Refresh national laboratory Genesis news"
            if git push origin HEAD:main; then
              echo "Published first-party archive updates"
              exit 0
            fi
            sleep 3
          done
          echo "Archive push could not converge after retries" >&2
          exit 1
