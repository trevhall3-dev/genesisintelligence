name: Collect rotating Genesis project watchlist
on:
  push:
    paths:
      - 'scripts/collect_genesis_news.py'
      - '.github/workflows/refresh-project-watchlist.yml'
  workflow_dispatch:
  schedule:
    - cron: "41 */4 * * *"
permissions:
  contents: write
concurrency:
  group: genesis-news-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile scripts/collect_genesis_news.py
      - run: python scripts/collect_genesis_news.py --channel projects
      - name: Commit only actual archive changes
        run: |
          git config user.name "genesis-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/news-archive.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh rotating Genesis project watchlist"
            git pull --rebase origin main
            git push origin main
          fi
