name: Refresh official Genesis project registry
on:
  push:
    paths:
      - 'scripts/import_genesis_projects.py'
      - 'scripts/collect_genesis_news.py'
      - '.github/workflows/refresh-projects.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pdfplumber
      - run: python scripts/import_genesis_projects.py
      - run: python scripts/collect_genesis_news.py
      - name: Commit updated official project records
        run: |
          git config user.name "genesis-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/projects.json dist/news-archive.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh DOE Genesis project registry"
            git pull --rebase origin main
            git push origin main
          fi
