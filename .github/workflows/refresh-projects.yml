name: Refresh official Genesis project registry
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pdfplumber
      - run: python scripts/import_genesis_projects.py
      - name: Commit updated official project records
        run: |
          git config user.name "genesis-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/projects.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh DOE Genesis project registry"
            git push
          fi
