name: Refresh official Genesis project registry daily
on:
  push:
    paths:
      - 'scripts/import_genesis_projects.py'
      - '.github/workflows/refresh-genesis-projects-daily.yml'
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * *"
permissions:
  contents: write
concurrency:
  group: genesis-projects-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pdfplumber
      - run: python scripts/import_genesis_projects.py
      - name: Commit revised Genesis registry
        run: |
          git config user.name "genesis-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/projects.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh DOE Genesis project registry (daily)"
            git pull --rebase origin main
            git push origin main
          fi
